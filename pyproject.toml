[project]
name = "i2c_api"
description = "I2C API"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bitstring >= 4.4.0, < 5.0.0",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]


